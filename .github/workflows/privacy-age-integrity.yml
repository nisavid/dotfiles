name: Privacy age protected boundary

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

concurrency:
  group: privacy-age-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify trusted base against candidate data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact untrusted candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: untrusted-head
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the pinned age parser
        shell: bash
        env:
          AGE_VERSION: "1.3.1"
        run: |
          set -euo pipefail
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          package="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error \
            --output "$package" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$package" | sha256sum --check
          tar -xzf "$package" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/age-bin"
          install -m 0755 \
            "$RUNNER_TEMP/age/age-inspect" \
            "$RUNNER_TEMP/age-bin"
          printf '%s\n' "$RUNNER_TEMP/age-bin" >>"$GITHUB_PATH"

      - name: Verify the protected transition and scan candidate data
        shell: bash
        env:
          PRIVACY_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PRIVACY_BASE_REF" = "main"
          [[ "$PRIVACY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIVACY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted-base rev-parse HEAD)" = "$PRIVACY_BASE_SHA"
          test "$(git -C untrusted-head rev-parse HEAD)" = "$PRIVACY_HEAD_SHA"
          test "$(age-inspect --version)" = "v1.3.1"
          python3 trusted-base/scripts/privacy_age_integrity_gate.py \
            --base-repository trusted-base \
            --base-commit "$PRIVACY_BASE_SHA" \
            --head-repository untrusted-head \
            --head-commit "$PRIVACY_HEAD_SHA"
          python3 trusted-base/scripts/privacy-scan \
            --root "$GITHUB_WORKSPACE/untrusted-head" \
            --require-age-manifest
