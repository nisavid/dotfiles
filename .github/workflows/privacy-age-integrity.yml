# Protected admission activation sentinel: owner-signed-age-v1
name: Privacy age protected boundary

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

concurrency:
  group: privacy-age-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  AGE_VERSION: "1.3.1"

jobs:
  begin:
    outputs:
      snapshot_b64: ${{ steps.snapshot.outputs.snapshot_b64 }}
      snapshot_sha256: ${{ steps.snapshot.outputs.snapshot_sha256 }}
      repository: ${{ steps.snapshot.outputs.repository }}
      pull_request: ${{ steps.snapshot.outputs.pull_request }}
      base_ref: ${{ steps.snapshot.outputs.base_ref }}
      base_sha: ${{ steps.snapshot.outputs.base_sha }}
      head_repository: ${{ steps.snapshot.outputs.head_repository }}
      head_sha: ${{ steps.snapshot.outputs.head_sha }}
      body_sha256: ${{ steps.snapshot.outputs.body_sha256 }}
      trusted_tools_sha: ${{ steps.trusted-revision.outputs.sha }}
    name: Begin live pull-request binding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default-branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the trusted tool revision
        id: trusted-revision
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(git -C trusted-tools rev-parse --verify HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$trusted_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$trusted_sha" >>"$GITHUB_OUTPUT"

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Read the live pull-request snapshot
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVACY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-age-begin"
          python3 -I trusted-tools/scripts/privacy_age_pr_snapshot.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/privacy-age-begin/snapshot.json" \
            --repository "$PRIVACY_REPOSITORY"
          snapshot="$RUNNER_TEMP/privacy-age-begin/snapshot.json"
          snapshot_b64="$(base64 --wrap=0 "$snapshot")"
          snapshot_sha256="$(sha256sum "$snapshot" | awk '{print $1}')"
          printf 'snapshot_b64=%s\n' "$snapshot_b64" >>"$GITHUB_OUTPUT"
          printf 'snapshot_sha256=sha256:%s\n' "$snapshot_sha256" >>"$GITHUB_OUTPUT"
          printf 'repository=%s\n' "$(jq -r .repository "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'pull_request=%s\n' "$(jq -r .pull_request "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$(jq -r .base_ref "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$(jq -r .base_commit "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'head_repository=%s\n' "$(jq -r .head_repository "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(jq -r .head_commit "$snapshot")" >>"$GITHUB_OUTPUT"
          printf 'body_sha256=%s\n' "$(jq -r .body_sha256 "$snapshot")" >>"$GITHUB_OUTPUT"
          test "$(jq -r .base_ref "$snapshot")" = "main"
          test "$(jq -r .state "$snapshot")" = "open"

  verify:
    outputs:
      state_b64: ${{ steps.state.outputs.state_b64 }}
      state_sha256: ${{ steps.state.outputs.state_sha256 }}
    name: Verify trusted base against candidate data
    needs: begin
    if: ${{ !cancelled() && needs.begin.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted default-branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.begin.outputs.trusted_tools_sha || github.sha }}
          path: trusted-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Re-read the live binding and current pull-request body
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVACY_REPOSITORY: ${{ needs.begin.outputs.repository }}
          TRUSTED_TOOLS_SHA: ${{ needs.begin.outputs.trusted_tools_sha }}
          BEGIN_SNAPSHOT_B64: ${{ needs.begin.outputs.snapshot_b64 }}
          BEGIN_SNAPSHOT_SHA256: ${{ needs.begin.outputs.snapshot_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-tools rev-parse --verify HEAD)" = "$TRUSTED_TOOLS_SHA"
          mkdir -p "$RUNNER_TEMP/privacy-age-verify"
          printf '%s' "$BEGIN_SNAPSHOT_B64" | base64 --decode >"$RUNNER_TEMP/privacy-age-verify/begin.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/privacy-age-verify/begin.json" | awk '{print $1}')" = "$BEGIN_SNAPSHOT_SHA256"
          python3 -I trusted-tools/scripts/privacy_age_pr_snapshot.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/privacy-age-verify/snapshot.json" \
            --body-output "$RUNNER_TEMP/privacy-age-verify/body" \
            --repository "$PRIVACY_REPOSITORY"
          cmp -s \
            "$RUNNER_TEMP/privacy-age-verify/begin.json" \
            "$RUNNER_TEMP/privacy-age-verify/snapshot.json"

      - name: Check out the exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.begin.outputs.base_sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact untrusted candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.begin.outputs.head_repository }}
          ref: ${{ needs.begin.outputs.head_sha }}
          path: untrusted-head
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install the pinned age parser
        shell: bash
        run: |
          set -euo pipefail
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          package="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error \
            --output "$package" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$package" | sha256sum --check
          tar -xzf "$package" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/age-bin"
          install -m 0755 \
            "$RUNNER_TEMP/age/age-inspect" \
            "$RUNNER_TEMP/age-bin"
          printf '%s\n' "$RUNNER_TEMP/age-bin" >>"$GITHUB_PATH"

      - name: Verify checkout bytes match Git objects
        shell: bash
        env:
          PRIVACY_BASE_SHA: ${{ needs.begin.outputs.base_sha }}
          PRIVACY_HEAD_SHA: ${{ needs.begin.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Keep this verifier self-contained and before any trusted-base
          # import: it is the pre-import boundary that proves both checkouts
          # match their advertised Git objects. Its deliberate overlap with
          # the local receipt creator is defense in depth against changed
          # candidate data or checkout state that does not match Git objects.
          python3 -I - "$PRIVACY_BASE_SHA" trusted-base "$PRIVACY_HEAD_SHA" untrusted-head <<'PY'
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path

          MAX_TREE_BYTES = 8 * 1024 * 1024
          MAX_TREE_ENTRIES = 10_000
          MAX_BLOB_BYTES = 16 * 1024 * 1024
          MAX_TOTAL_BLOB_BYTES = 16 * 1024 * 1024
          NO_FOLLOW = getattr(os, "O_NOFOLLOW", None)
          NO_BLOCK = getattr(os, "O_NONBLOCK", None)
          if NO_FOLLOW is None or NO_BLOCK is None:
              raise SystemExit("checkout byte verification unavailable")
          if len(sys.argv) != 5 or any(
              re.fullmatch(r"[0-9a-f]{40}", value) is None
              for value in (sys.argv[1], sys.argv[3])
          ):
              raise SystemExit("checkout byte verification failed")

          def git(
              repository: str,
              *arguments: str,
              maximum_output_bytes: int,
              input_data: bytes | None = None,
          ) -> bytes:
              environment = os.environ.copy()
              for variable in (
                  "GIT_ALTERNATE_OBJECT_DIRECTORIES",
                  "GIT_COMMON_DIR",
                  "GIT_CONFIG_COUNT",
                  "GIT_CONFIG_PARAMETERS",
                  "GIT_CONFIG_LOCAL",
                  "GIT_CONFIG_SYSTEM",
                  "GIT_DIR",
                  "GIT_INDEX_FILE",
                  "GIT_OBJECT_DIRECTORY",
                  "GIT_WORK_TREE",
              ):
                  environment.pop(variable, None)
              for variable in tuple(environment):
                  if variable.startswith(("GIT_CONFIG_KEY_", "GIT_CONFIG_VALUE_")):
                      environment.pop(variable, None)
              environment.update(
                  {
                      "GIT_CONFIG_GLOBAL": os.devnull,
                      "GIT_CONFIG_NOSYSTEM": "1",
                      "GIT_NO_LAZY_FETCH": "1",
                      "GIT_NO_REPLACE_OBJECTS": "1",
                      "GIT_OPTIONAL_LOCKS": "0",
                      "GIT_TERMINAL_PROMPT": "0",
                      "LC_ALL": "C",
                  }
              )
              result = subprocess.run(
                  [
                      "git",
                      "-c",
                      "core.fsmonitor=false",
                      "-c",
                      f"core.hooksPath={os.devnull}",
                      "-C",
                      repository,
                      *arguments,
                  ],
                  check=False,
                  capture_output=True,
                  input=input_data,
                  env=environment,
                  timeout=30,
              )
              if result.returncode != 0 or len(result.stdout) > maximum_output_bytes:
                  raise SystemExit("checkout byte verification failed")
              return result.stdout

          def read_regular(path: Path) -> bytes:
              try:
                  descriptor = os.open(path, os.O_RDONLY | NO_FOLLOW | NO_BLOCK)
              except OSError as error:
                  raise SystemExit("checkout byte verification failed") from error
              try:
                  info = os.fstat(descriptor)
                  if not stat.S_ISREG(info.st_mode) or info.st_size > MAX_BLOB_BYTES:
                      raise SystemExit("checkout byte verification failed")
                  chunks: list[bytes] = []
                  remaining = MAX_BLOB_BYTES + 1
                  while remaining:
                      chunk = os.read(descriptor, min(remaining, 64 * 1024))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  return b"".join(chunks)
              finally:
                  os.close(descriptor)

          def blob_batch(repository: str, object_ids: list[bytes]) -> dict[bytes, bytes]:
              unique_object_ids = list(dict.fromkeys(object_ids))
              if not unique_object_ids:
                  return {}
              if any(
                  len(object_id) != 40
                  or not re.fullmatch(rb"[0-9a-f]{40}", object_id)
                  for object_id in unique_object_ids
              ):
                  raise SystemExit("checkout byte verification failed")
              request = b"".join(object_id + b"\n" for object_id in unique_object_ids)
              raw = git(
                  repository,
                  "cat-file",
                  "--batch",
                  maximum_output_bytes=MAX_TOTAL_BLOB_BYTES + len(unique_object_ids) * 96,
                  input_data=request,
              )
              blobs: dict[bytes, bytes] = {}
              offset = 0
              total_blob_bytes = 0
              for object_id in unique_object_ids:
                  line_end = raw.find(b"\n", offset)
                  if line_end < 0:
                      raise SystemExit("checkout byte verification failed")
                  header = raw[offset:line_end].split(b" ")
                  offset = line_end + 1
                  if len(header) != 3 or header[0] != object_id or header[1] != b"blob":
                      raise SystemExit("checkout byte verification failed")
                  try:
                      size = int(header[2], 10)
                  except (TypeError, ValueError) as error:
                      raise SystemExit("checkout byte verification failed") from error
                  if size < 0 or size > MAX_BLOB_BYTES:
                      raise SystemExit("checkout byte verification failed")
                  total_blob_bytes += size
                  if total_blob_bytes > MAX_TOTAL_BLOB_BYTES:
                      raise SystemExit("checkout byte verification failed")
                  end = offset + size
                  if end >= len(raw) or raw[end : end + 1] != b"\n":
                      raise SystemExit("checkout byte verification failed")
                  blobs[object_id] = raw[offset:end]
                  offset = end + 1
              if offset != len(raw):
                  raise SystemExit("checkout byte verification failed")
              return blobs

          def verify_filesystem_entries(
              root: Path,
              seen_paths: set[bytes],
          ) -> None:
              """Reject checkout leaves and directories absent from the Git tree."""

              actual_paths: set[bytes] = set()
              actual_directories: set[bytes] = set()
              pending = [root]
              while pending:
                  current = pending.pop()
                  try:
                      entries = os.scandir(current)
                  except OSError as error:
                      raise SystemExit("checkout byte verification failed") from error
                  with entries:
                      for entry in entries:
                          if current == root and entry.name == ".git":
                              continue
                          try:
                              relative = os.fsencode(
                                  Path(entry.path).relative_to(root).as_posix()
                              )
                              if not relative or b"\x00" in relative:
                                  raise SystemExit("checkout byte verification failed")
                              if entry.is_symlink():
                                  actual_paths.add(relative)
                              elif entry.is_dir(follow_symlinks=False):
                                  actual_directories.add(relative)
                                  pending.append(Path(entry.path))
                              elif entry.is_file(follow_symlinks=False):
                                  actual_paths.add(relative)
                              else:
                                  raise SystemExit("checkout byte verification failed")
                          except OSError as error:
                              raise SystemExit("checkout byte verification failed") from error
                          if (
                              len(actual_paths) > MAX_TREE_ENTRIES
                              or len(actual_directories) > MAX_TREE_ENTRIES
                          ):
                              raise SystemExit("checkout byte verification failed")

              expected_directories: set[bytes] = set()
              for raw_path in seen_paths:
                  parts = raw_path.split(b"/")
                  expected_directories.update(
                      b"/".join(parts[:index])
                      for index in range(1, len(parts))
                  )
              if (
                  actual_paths != seen_paths
                  or not actual_directories <= expected_directories
              ):
                  raise SystemExit("checkout byte verification failed")

          def verify(repository: str, commit: str) -> None:
              root = Path(repository).resolve(strict=True)
              raw_tree = git(
                  repository,
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  commit,
                  maximum_output_bytes=MAX_TREE_BYTES,
              )
              seen_paths: set[bytes] = set()
              records: list[tuple[bytes, str, bytes]] = []
              for record in raw_tree.split(b"\0"):
                  if not record:
                      continue
                  if len(seen_paths) >= MAX_TREE_ENTRIES:
                      raise SystemExit("checkout byte verification failed")
                  try:
                      metadata, raw_path = record.split(b"\t", 1)
                      mode, kind, object_id = metadata.split(b" ", 2)
                      relative = raw_path.decode("utf-8")
                  except (UnicodeDecodeError, ValueError) as error:
                      raise SystemExit("checkout byte verification failed") from error
                  if (
                      kind != b"blob"
                      or raw_path in seen_paths
                      or len(object_id) != 40
                      or not re.fullmatch(rb"[0-9a-f]{40}", object_id)
                      or not relative
                      or relative.startswith("/")
                      or "\\" in relative
                  ):
                      raise SystemExit("checkout byte verification failed")
                  if any(segment in {"", ".", ".."} for segment in relative.split("/")):
                      raise SystemExit("checkout byte verification failed")
                  seen_paths.add(raw_path)
                  records.append((mode, relative, object_id))
              blobs = blob_batch(repository, [record[2] for record in records])
              total_blob_bytes = 0
              for mode, relative, object_id in records:
                  try:
                      expected = blobs[object_id]
                  except KeyError as error:
                      raise SystemExit("checkout byte verification failed") from error
                  total_blob_bytes += len(expected)
                  if total_blob_bytes > MAX_TOTAL_BLOB_BYTES:
                      raise SystemExit("checkout byte verification failed")
                  path = root.joinpath(*relative.split("/"))
                  try:
                      info = path.lstat()
                  except OSError as error:
                      raise SystemExit("checkout byte verification failed") from error
                  if mode == b"120000":
                      if not stat.S_ISLNK(info.st_mode) or os.fsencode(os.readlink(path)) != expected:
                          raise SystemExit("checkout byte verification failed")
                  elif mode in {b"100644", b"100755"}:
                      if not stat.S_ISREG(info.st_mode) or read_regular(path) != expected:
                          raise SystemExit("checkout byte verification failed")
                      if bool(stat.S_IMODE(info.st_mode) & 0o111) != (mode == b"100755"):
                          raise SystemExit("checkout byte verification failed")
                  else:
                      raise SystemExit("checkout byte verification failed")
              verify_filesystem_entries(root, seen_paths)

          def require_trusted_executable(repository: str, relative: str, mode: int) -> None:
              path = Path(repository).joinpath(*relative.split("/"))
              try:
                  info = path.lstat()
              except OSError as error:
                  raise SystemExit("trusted verifier path is unavailable") from error
              if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != mode:
                  raise SystemExit("trusted verifier path is not a regular executable")

          require_trusted_executable(
              sys.argv[2],
              "scripts/privacy_age_integrity_gate.py",
              0o755,
          )
          require_trusted_executable(sys.argv[2], "scripts/privacy-scan", 0o755)
          verify(sys.argv[2], sys.argv[1])
          verify(sys.argv[4], sys.argv[3])
          PY

      - name: Verify the protected transition and scan candidate data
        shell: bash
        env:
          AGE_TOOLING_DIRECTORY: ${{ runner.temp }}/age-bin
          PRIVACY_BASE_REF: ${{ needs.begin.outputs.base_ref }}
          PRIVACY_BASE_SHA: ${{ needs.begin.outputs.base_sha }}
          PRIVACY_HEAD_SHA: ${{ needs.begin.outputs.head_sha }}
          PRIVACY_REPOSITORY: ${{ needs.begin.outputs.repository }}
        run: |
          set -euo pipefail
          test "$PRIVACY_BASE_REF" = "main"
          [[ "$PRIVACY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIVACY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted-base rev-parse HEAD)" = "$PRIVACY_BASE_SHA"
          test "$(git -C untrusted-head rev-parse HEAD)" = "$PRIVACY_HEAD_SHA"
          test "$("$AGE_TOOLING_DIRECTORY/age-inspect" --version)" = "v${AGE_VERSION}"
          # Candidate files are data for the trusted scanner only. The scanner
          # runs before the verifier and neither imports nor executes them.
          python3 -I trusted-base/scripts/privacy-scan \
            --root "$GITHUB_WORKSPACE/untrusted-head" \
            --require-age-manifest
          python3 -I trusted-base/scripts/privacy_age_integrity_gate.py \
            --base-repository trusted-base \
            --base-commit "$PRIVACY_BASE_SHA" \
            --head-repository untrusted-head \
            --head-commit "$PRIVACY_HEAD_SHA" \
            --admission-body "$RUNNER_TEMP/privacy-age-verify/body" \
            --allowed-signers trusted-base/.github/age-admission/allowed_signers \
            --snapshot-file "$RUNNER_TEMP/privacy-age-verify/snapshot.json" \
            --result-file "$RUNNER_TEMP/privacy-age-verify/result.json" \
            --state-file "$RUNNER_TEMP/privacy-age-verify/state.json" \
            --repository "$PRIVACY_REPOSITORY"

      - name: Expose verifier state to completion
        id: state
        if: ${{ !cancelled() && (success() || failure()) }}
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/privacy-age-verify/state.json"
          if [[ -s "$state" ]]; then
            printf 'state_b64=%s\n' "$(base64 --wrap=0 "$state")" >>"$GITHUB_OUTPUT"
            printf 'state_sha256=sha256:%s\n' "$(sha256sum "$state" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
          else
            printf 'state_b64=\n' >>"$GITHUB_OUTPUT"
            printf 'state_sha256=\n' >>"$GITHUB_OUTPUT"
          fi

  publish:
    name: Complete App admission publication
    needs: [begin, verify]
    # This is the completion state-machine edge. It publishes a blocking
    # failure when begin/verify failed, but never runs after cancellation.
    if: ${{ !cancelled() && always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: privacy-age-admission-publisher
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          # The publisher source is always trusted default-branch code. Event
          # values only identify the repository and pull request; the
          # publisher rereads the live PR before every decision and write.
          ref: ${{ needs.begin.outputs.trusted_tools_sha || github.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Materialize the authenticated verifier handoff
        shell: bash
        env:
          STATE_B64: ${{ needs.verify.outputs.state_b64 }}
          STATE_SHA256: ${{ needs.verify.outputs.state_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-age-publish"
          state="$RUNNER_TEMP/privacy-age-publish/state.json"
          if [[ -n "${STATE_B64:-}" ]]; then
            python3 -I - "$state" "$STATE_B64" "$STATE_SHA256" <<'PY'
            import base64
            import binascii
            import hashlib
            import os
            import sys

            destination, encoded, expected_digest = sys.argv[1:]
            try:
                data = base64.b64decode(encoded, validate=True)
            except (ValueError, binascii.Error) as error:
                raise SystemExit("invalid verifier handoff encoding") from error
            if len(data) > 256 * 1024:
                raise SystemExit("verifier handoff is oversized")
            if "sha256:" + hashlib.sha256(data).hexdigest() != expected_digest:
                raise SystemExit("verifier handoff digest mismatch")
            no_follow = getattr(os, "O_NOFOLLOW", 0)
            if not no_follow:
                raise SystemExit("safe verifier handoff is unavailable")
            descriptor = os.open(
                destination,
                os.O_WRONLY | os.O_CREAT | os.O_EXCL | no_follow,
                0o600,
            )
            try:
                os.fchmod(descriptor, 0o600)
                with os.fdopen(descriptor, "wb") as handle:
                    descriptor = -1
                    handle.write(data)
            finally:
                if descriptor >= 0:
                    os.close(descriptor)
            PY
          fi

      # The App key is available only in this protected, admin-owned
      # environment. Compute jobs receive no secret and no installation token.
      - name: Mint a short-lived App installation token
        id: app-token
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254
        with:
          app-id: 4695065
          private-key: ${{ secrets.PRIVACY_AGE_ADMISSION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dotfiles
          permission-checks: write

      - name: Publish the App-owned admission context
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APP_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          PRIVACY_REPOSITORY: ${{ github.repository }}
          TRUSTED_TOOLS_SHA: ${{ needs.begin.outputs.trusted_tools_sha }}
          FALLBACK_TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trusted_sha="$(git -C trusted-base rev-parse --verify HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${TRUSTED_TOOLS_SHA:-}" ]]; then
            test "$trusted_sha" = "$TRUSTED_TOOLS_SHA"
          else
            [[ "$FALLBACK_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$trusted_sha" = "$FALLBACK_TRUSTED_SHA"
          fi
          python3 -I trusted-base/scripts/privacy_age_admission_publisher.py \
            --event "$GITHUB_EVENT_PATH" \
            --state-file "$RUNNER_TEMP/privacy-age-publish/state.json" \
            --repository "$PRIVACY_REPOSITORY"
