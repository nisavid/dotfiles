name: Hindsight cutover runbook

on:
  pull_request:
    paths:
      - .github/workflows/hindsight-cutover-runbook.yml
      - home/.chezmoidata/hindsight.toml
      - scripts/hindsight-control-plane-cutover.zsh
      - tests/hindsight-cutover-runbook.zsh
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: hindsight cutover runbook
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out dotfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dotfiles
          persist-credentials: false

      - name: Read the Hindsight release pin
        id: pin
        shell: bash
        working-directory: dotfiles
        run: |
          set -euo pipefail
          release_commit=$(
            sed -nE \
              's/^releaseCommit[[:space:]]*=[[:space:]]*"([^"]*)"[[:space:]]*$/\1/p' \
              home/.chezmoidata/hindsight.toml
          )
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::releaseCommit in home/.chezmoidata/hindsight.toml is not one 40-character commit SHA"
            exit 1
          fi
          echo "release-commit=$release_commit" >>"$GITHUB_OUTPUT"

      - name: Check out the pinned agents release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nisavid/agents
          ref: ${{ steps.pin.outputs.release-commit }}
          path: agents
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the agents checkout matches the pin
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.pin.outputs.release-commit }}
        run: |
          set -euo pipefail
          head=$(git -C agents rev-parse HEAD)
          if [[ "$head" != "$RELEASE_COMMIT" ]]; then
            echo "::error::agents checkout is at $head, not the pinned $RELEASE_COMMIT"
            exit 1
          fi
          changes=$(git -C agents status --porcelain)
          if [[ -n "$changes" ]]; then
            echo "::error::agents checkout at the pinned commit is not clean"
            exit 1
          fi

      - name: Record the default temporary directory
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ.get("TMPDIR") or "/tmp")
          before = sorted(path.name for path in root.glob("hindsight-cutover-test.*"))
          record = {"root": str(root), "before": before}
          (Path(os.environ["RUNNER_TEMP"]) / "cutover-temp-before.json").write_text(json.dumps(record))
          print(f"Default TMPDIR: {root}")
          print(f"Resolved directory: {root.resolve()}")
          print(f"Existing cutover fixture directories: {len(before)}")
          PY

      - name: Run the cutover runbook suite
        working-directory: dotfiles
        env:
          HINDSIGHT_AGENTS_ROOT: ${{ github.workspace }}/agents
        run: zsh tests/hindsight-cutover-runbook.zsh

      - name: Diagnose a failed cutover fixture
        if: failure()
        shell: bash
        env:
          HINDSIGHT_AGENTS_ROOT: ${{ github.workspace }}/agents
        run: |
          set -euo pipefail
          diagnostic="$RUNNER_TEMP/cutover-diagnostic"
          mkdir -p "$diagnostic/scripts" "$diagnostic/tests" "$diagnostic/home/.chezmoidata"
          cp dotfiles/tests/hindsight-cutover-runbook.zsh "$diagnostic/tests/"
          cp dotfiles/home/.chezmoidata/hindsight.toml "$diagnostic/home/.chezmoidata/"
          { head -n 1 dotfiles/scripts/hindsight-control-plane-cutover.zsh; echo 'set -x'; tail -n +2 dotfiles/scripts/hindsight-control-plane-cutover.zsh; } > "$diagnostic/scripts/hindsight-control-plane-cutover.zsh"
          zsh -x "$diagnostic/tests/hindsight-cutover-runbook.zsh"

      - name: Verify cutover fixture cleanup
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          record_path = Path(os.environ["RUNNER_TEMP"]) / "cutover-temp-before.json"
          if not record_path.exists():
              raise SystemExit("Temporary-directory observation did not run")
          record = json.loads(record_path.read_text())
          after = {path.name for path in Path(record["root"]).glob("hindsight-cutover-test.*")}
          added = sorted(after - set(record["before"]))
          print(f"New cutover fixture directories remaining: {len(added)}")
          if added:
              raise SystemExit("Cutover suite left fixture directories: " + ", ".join(added))
          PY
