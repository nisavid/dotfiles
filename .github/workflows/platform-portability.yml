name: Platform portability

# Zsh GUI path deployment is verified by zsh-deployment-portability.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGE_VERSION: "1.3.1"
  CHEZMOI_VERSION: "2.71.0"

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Python runtime dependencies
        shell: bash
        run: python3 -m pip install uv==0.11.32

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bat flock jq ripgrep
          case "$(uname -m)" in
            arm64)
              archive=chezmoi_${CHEZMOI_VERSION}_darwin_arm64.tar.gz
              digest=8b03d7be6b5d500a503c712ae6da7dd6817b6c3328223b4ae8be7a8be5a2fa3a
              age_archive=age-v${AGE_VERSION}-darwin-arm64.tar.gz
              age_digest=01120ea2cbf0463d4c6bd767f99f3271bbed1cdc8a9aa718a76ba1fe4f01998b
              ;;
            x86_64)
              archive=chezmoi_${CHEZMOI_VERSION}_darwin_amd64.tar.gz
              digest=12b78b365528597ad701f5117fa71f6c42b5b1e65d8075e19c48472ad81faf30
              age_archive=age-v${AGE_VERSION}-darwin-amd64.tar.gz
              age_digest=2b233301ad21ab7b1eabd9ae1198a164005fa4928fcdd745d47c39f8593209d7
              ;;
            *)
              printf 'unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          package="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error \
            --output "$package" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$archive"
          printf '%s  %s\n' "$digest" "$package" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          tar -xzf "$package" -C "$RUNNER_TEMP/chezmoi-bin" chezmoi
          age_package="$RUNNER_TEMP/$age_archive"
          curl --fail --location --silent --show-error \
            --output "$age_package" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$age_archive"
          printf '%s  %s\n' "$age_digest" "$age_package" | shasum -a 256 --check
          tar -xzf "$age_package" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/age/age" \
            "$RUNNER_TEMP/age/age-keygen" \
            "$RUNNER_TEMP/age/age-inspect" \
            "$RUNNER_TEMP/chezmoi-bin"
          printf '%s\n' "$RUNNER_TEMP/chezmoi-bin" >>"$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y acl bat curl jq ripgrep zsh
          sudo ln -s /usr/bin/batcat /usr/local/bin/bat
          archive=chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz
          package="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error \
            --output "$package" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$archive"
          printf '%s  %s\n' \
            6ea2040ecc0e82d3dac604289e100b0157afefcd94ebb818e5f6e31655156d34 \
            "$package" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          tar -xzf "$package" -C "$RUNNER_TEMP/chezmoi-bin" chezmoi
          age_archive=age-v${AGE_VERSION}-linux-amd64.tar.gz
          age_package="$RUNNER_TEMP/$age_archive"
          curl --fail --location --silent --show-error \
            --output "$age_package" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$age_archive"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$age_package" | sha256sum --check
          tar -xzf "$age_package" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/age/age" \
            "$RUNNER_TEMP/age/age-keygen" \
            "$RUNNER_TEMP/age/age-inspect" \
            "$RUNNER_TEMP/chezmoi-bin"
          printf '%s\n' "$RUNNER_TEMP/chezmoi-bin" >>"$GITHUB_PATH"

      - name: Verify chezmoi version
        shell: bash
        run: chezmoi --version | grep -Fq "chezmoi version v${CHEZMOI_VERSION},"

      - name: Verify age parser version
        shell: bash
        run: |
          set -euo pipefail
          test "$(age --version)" = "v${AGE_VERSION}"
          test "$(age-inspect --version)" = "v${AGE_VERSION}"

      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            home/run_after_restore-acl.sh \
            home/run_before_save-acl.sh \
            scripts/private-skill-transaction \
            scripts/private-skill-transaction.d/*.bash
          zsh -n \
            home/run_after_sync-global-agent-skills-to-claude.zsh \
            tests/claude-skill-sync.zsh \
            tests/container-runtime-bindings.zsh \
            tests/global-agents-policy.zsh \
            tests/hindsight-agents-bindings.zsh \
            tests/identity-bindings.zsh \
            tests/platform-portability.zsh \
            tests/private-skill-transaction.zsh \
            tests/privacy-scan.zsh \
            tests/proton-pass-session.zsh \
            tests/secret-command-shims.zsh \
            tests/secret-exec-migrate.zsh \
            tests/secret-exec.zsh \
            tests/secret-injection-bindings.zsh \
            tests/private-skill-transaction.d/*.zsh

      - name: Verify platform bindings
        shell: bash
        run: |
          set -euo pipefail
          zsh -f tests/claude-skill-sync.zsh
          zsh -f tests/platform-portability.zsh
          zsh -f tests/container-runtime-bindings.zsh
          zsh -f tests/privacy-scan.zsh
          python3 scripts/privacy-scan --root . --require-age-manifest
          zsh -f tests/identity-bindings.zsh
          zsh -f tests/secret-exec.zsh
          zsh -f tests/secret-command-shims.zsh
          zsh -f tests/secret-exec-migrate.zsh
          zsh -f tests/secret-injection-bindings.zsh
          zsh -f tests/proton-pass-session.zsh
          GLOBAL_AGENTS_POLICY_PUBLIC_ONLY=1 \
            zsh -f tests/global-agents-policy.zsh
          if [[ "$RUNNER_OS" == Linux ]]; then
            zsh -f tests/hindsight-agents-bindings.zsh
          fi
          python3 -m unittest tests/test_chezmoi_source_ownership.py
          python3 -m unittest tests/test_agent_equipment_acceptance.py
          python3 -m unittest tests/test_agent_equipment_acceptance_evidence.py
          python3 -m unittest tests/test_agent_equipment_adapter_contract.py
          python3 -m unittest tests/test_agent_equipment_captured_state.py
          python3 -m unittest tests/test_agent_equipment_deployment_contract.py
          python3 -m unittest tests/test_agent_equipment_design.py
          python3 -m unittest tests/test_agent_equipment_json_schema.py
          REQUIRE_AGE_TOOLING=1 \
            python3 -m unittest tests/test_agent_equipment_public_data.py
          python3 -m unittest tests/test_privacy_age_integrity_gate.py
          REQUIRE_AGE_TOOLING=1 \
            python3 -m unittest tests/test_privacy_age_envelopes.py
          uvx --from check-jsonschema==0.35.0 \
            check-jsonschema --check-metaschema \
            docs/agent-equipment/adapter-contract-v1.schema.json \
            docs/agent-equipment/acceptance-evidence-v1.schema.json \
            docs/agent-equipment/catalog-v1.schema.json \
            docs/agent-equipment/lock-v1.schema.json \
            docs/agent-equipment/captured-state-v1.schema.json \
            docs/agent-equipment/execution-authority-v1.schema.json \
            docs/agent-equipment/plan-action-set-v1.schema.json
          uvx --from check-jsonschema==0.35.0 check-jsonschema \
            --schemafile docs/agent-equipment/adapter-contract-v1.schema.json \
            tests/fixtures/agent-equipment/schema/valid-adapter-*.json
          uvx --from check-jsonschema==0.35.0 check-jsonschema \
            --schemafile docs/agent-equipment/catalog-v1.schema.json \
            tests/fixtures/agent-equipment/schema/valid-catalog.json \
            docs/agent-equipment/initial-catalog.proposed.json
          uvx --from check-jsonschema==0.35.0 check-jsonschema \
            --base-uri "file://$PWD/docs/agent-equipment/lock-v1.schema.json" \
            --schemafile docs/agent-equipment/lock-v1.schema.json \
            tests/fixtures/agent-equipment/schema/valid-lock.json \
            docs/agent-equipment/initial-lock.proposed.json
          uvx --from check-jsonschema==0.35.0 check-jsonschema \
            --schemafile docs/agent-equipment/captured-state-v1.schema.json \
            tests/fixtures/agent-equipment/schema/valid-captured-state.json
          uvx --from check-jsonschema==0.35.0 check-jsonschema \
            --schemafile docs/agent-equipment/plan-action-set-v1.schema.json \
            tests/fixtures/agent-equipment/schema/valid-plan-action-set.json
          python3 scripts/agent_equipment_captured_state.py \
            --authoritative-plan-actions \
            tests/fixtures/agent-equipment/schema/valid-plan-action-set.json \
            --expected-candidate-identity \
            candidate:fixture/controller-v1 \
            --expected-implementation-manifest-digest \
            sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            tests/fixtures/agent-equipment/schema/valid-captured-state.json

      - name: Verify private-skill transaction
        shell: bash
        run: |
          set -euo pipefail
          zsh -f tests/private-skill-transaction.zsh all
