name: Platform portability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify local fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in jq zsh shasum; do command -v "$tool"; done
      - name: Verify corrected retirement repeatedly
        shell: bash
        run: python3 -B -m tests.verify_age_recovery_signals
