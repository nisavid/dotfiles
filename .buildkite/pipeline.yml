# Retained native pipeline for the archived dotfiles Buildkite experiment.
# GitHub Actions runs the portability battery on both platforms. Do not
# reactivate this pipeline; see docs/research/BUILDKITE_GHA_PR_BUILDS.md.
steps:
  - group: ":linux: Ubuntu"
    key: linux
    steps:
      - label: ":linux: {{matrix}}"
        command: .buildkite/run-group.sh "{{matrix}}"
        agents:
          queue: linux-medium
        # The hosted host image is older than Ubuntu 24.04 (for example,
        # Python 3.10), so run each group in an ubuntu:24.04 container.
        plugins:
          - docker#v5.14.0:
              image: "ubuntu:24.04"
              workdir: /work/dotfiles
              mount-buildkite-agent: true
        timeout_in_minutes: 25
        matrix:
          - shell-bindings
          - proton-pass
          - discover
          - python-checks
          - age-admission
          - age-provisioning
          - zsh-deployment
        retry:
          automatic:
            - exit_status: -1
              limit: 2

  - label: ":stopwatch: Timings"
    depends_on:
      - linux
    allow_dependency_failure: true
    agents:
      queue: linux-small
    command: .buildkite/annotate-timings.sh
