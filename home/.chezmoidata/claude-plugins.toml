# Claude Code plugin enablement (dotfiles#479), settled 2026-11-19;
# real-skills-leashed moved to explicitlyOff the same day.
# explicitlyOff and oneCopyPerSkill are read by
# home/dot_claude/modify_private_settings.json.tmpl, which states what it writes
# to ~/.claude/settings.json; accepted is a record that it does not read. The
# modifier writes no key for a plugin on neither list: one with no entry loads
# normally, and an existing entry, such as one turned off by hand, is kept.
# The modifier also forces github and greptile off at the official marketplace
# and removes the stale serena@claude-plugins-official entry, as before. Claude
# Code's Context7 server is the official context7 plugin's remote server
# (dotfiles#521), so context7 is in localWins.
[claudePlugins]
# The accepted plugins, kept as a record; tests/secret-injection-bindings.zsh
# checks that it shares no name with explicitlyOff.
accepted = [
  "tricritical",
  "versionkeeping",
  "mergecraft",
  "rolecasting",
  "proseweaving",
  "artifact-customs",
  "surreal-intercom",
  "real-skills-unleashed",
  "typesafe",
  "jev",
  "agent-sdk-dev",
  "chrome-devtools-mcp",
  "claude-code-setup",
  "cloudflare",
  "coderabbit",
  "codex",
  "explanatory-output-style",
  "firecrawl",
  "impeccable",
  "linear",
  "mcp-apps",
  "mcp-server-dev",
  "modern-web-guidance",
  "plugin-dev",
  "security-guidance",
  "skill-creator",
  "vercel",
  "warp",
  "clangd-lsp",
  "pyright-lsp",
  "rust-analyzer-lsp",
  "typescript-lsp",
  "gopls-lsp",
  "lua-lsp",
  "claude-tag-data-viz",
  "pdf-viewer",
  "github",
  "greptile",
  "context7",
  "searchfit-seo",
  "figma",
  "design",
  "canva",
  "supericons",
  "railway",
  "render",
  "firebase",
  "exa",
  "desktop-commander",
  "playground",
  "pmm-positioning",
  "marketing",
  "sales",
  "data",
  "stripe",
  "claude-docs",
  "claude-security",
  "gitlab",
  "posthog",
  "redis-development",
  "resend",
  "sentry",
  "reverse-engineering",
  "setup-audit",
]

# Off as <name>@inline and <name>@synced, and as each <name>@<marketplace> key
# the installed-plugin registry lists. @inline and @synced keys use the name the
# plugin's own .claude-plugin/plugin.json declares, so these are those names.
explicitlyOff = [
  "mattpocock-skills",
  "huggingface-skills",
  "supabase",
  "twilio-developer-kit",
  "google-drive",
  "codex-dispatch",
  "amd-skills",
  "chrome-extension-builder",
  "equity-research",
  "intuit-quickbooks",
  "nvidia-skills",
  "remotion",
  "real-skills-leashed",
  "investment-banking",
  "pitch-agent",
]

# One copy per skill. Account copies, <name>@inline and <name>@synced, belong to
# the signed-in Claude account; local copies are <name>@<marketplace> entries.
# No rule here names these eleven plugins, which had both an account copy and a
# local copy: agent-sdk-dev, clangd-lsp, claude-code-setup, codex, firebase,
# firecrawl, gopls-lsp, lua-lsp, mcp-apps, rust-analyzer-lsp and typescript-lsp.
# The modifier forces neither of their copies; the localWins and off entries
# that forced claude-code-setup and firecrawl were removed. The owner chose the
# account copies for these eleven plugins on 2026-11-23 (dotfiles#538). His
# reason: "Wouldn't removing the account copies cause these tools to be
# unavailable in Claude Cloud threads?"
[claudePlugins.oneCopyPerSkill]
# The local copy wins for these plugins: <name>@claude-plugins-official is true,
# even where the entry exists as false, and <name>@inline and <name>@synced are
# false. The account copies of cloudflare and skill-creator match the local
# ones. context7: the owner chose the official plugin and its remote server for
# Claude Code (dotfiles#521), and an account copy would start a second Context7
# server that needs its own sign-in.
localWins = [
  "cloudflare",
  "skill-creator",
  "context7",
]
# Exact enabledPlugins entries that are false. linear is not a second copy of
# the account plugin: the local plugin is an MCP server with no skills, and the
# account plugin is one skill (linear-api) with no MCP server. Whether the local
# Linear MCP server should be on is not decided here.
off = [
  "linear@claude-plugins-official",
]
# The ~/.claude/skills/html folder itself, not a second copy: an existing entry
# is kept true, and a missing one (also on) is left missing.
on = [
  "html@skills-dir",
]
