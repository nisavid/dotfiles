# Run the pacman that makepkg -s, -r, and -i start through sudo at OOM score 0.
#
# ~/.local/bin/makepkg runs makepkg in builds.slice at an OOM score of at least
# 500 (see ~/.local/lib/builds-slice/builds-slice-command). pacman and its
# hooks, such as mkinitcpio, stay in that slice under sudo. Without this, they
# inherit that score, and a host-wide OOM or a cap kill in the slice would
# rank them with the build, even in the middle of a transaction. At score 0, a
# cap kill takes the processes scored 500 or more first, largest first, unless
# pacman or a hook holds about half the cap more memory than they do, and a
# host-wide OOM ranks those processes above desktop processes. They include
# the makepkg and sudo that pacman runs under, and pacman ends when sudo dies.
# So a transaction is spared only while a larger process scored 500 or more
# runs: a cap kill can end it when the slice fills with memory that no larger
# build process holds, such as a large hook or /dev/shm files, and a host-wide
# OOM can end it when no larger build is running. choom runs as root under
# sudo, and root may lower the score. -k keeps makepkg's default of asking for
# the password every time.
#
# run0 would take pacman out of the slice, but when makepkg runs on a terminal,
# polkit then lets any command that makepkg's own shell starts, such as one in
# a PKGBUILD's prepare() or build(), reuse run0's authorization for five
# minutes, while sudo -k asks every time.
#
# makepkg reads this file only with the default /etc/makepkg.conf, not with
# --config or MAKEPKG_CONF. A sudoers rule written for /usr/bin/pacman alone
# would not match this command. Without choom, as when the build-tool
# dispatcher also runs uncapped, makepkg keeps its default of sudo -k. The if
# keeps this file's last status 0, which makepkg requires of a sourced config.
if [[ -x /usr/bin/choom ]]; then
  PACMAN_AUTH=(sudo -k choom -n 0 --)
fi
