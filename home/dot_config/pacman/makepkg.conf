# Run the pacman that makepkg -s, -r, and -i start through sudo at OOM score 0.
#
# ~/.local/bin/makepkg runs makepkg in builds.slice at an OOM score of at least
# 500 (see ~/.local/lib/builds-slice/builds-slice-command). Without this, pacman
# and its hooks, such as mkinitcpio, inherit that score, and a host-wide OOM
# would favor them, even in the middle of a transaction. choom runs as root under
# sudo, and root may lower the score. -k keeps makepkg's default of asking for
# the password every time.
#
# makepkg reads this file only with the default /etc/makepkg.conf, not with
# --config or MAKEPKG_CONF. A sudoers rule written for /usr/bin/pacman alone
# would not match this command. Without choom, as when the build-tool
# dispatcher also runs uncapped, makepkg keeps its default of sudo -k. The if
# keeps this file's last status 0, which makepkg requires of a sourced config.
if [[ -x /usr/bin/choom ]]; then
  PACMAN_AUTH=(sudo -k choom -n 0 --)
fi
