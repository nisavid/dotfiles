# Run ydotoold only inside a graphical session, never at boot.
# ydotoold opens /dev/uinput once at startup. Without the input group, its only
# write access is the uaccess ACL that logind grants the user of the active seat
# session (here from KDE Connect's 40-kdeconnect-uinput.rules). With lingering
# on, the package's WantedBy=default.target started ydotoold at boot, while the
# login greeter still held that ACL, so it depended on the input group, which
# also lets any user process read every keystroke from /dev/input/event*.
# graphical-session.target.wants/ydotool.service starts it at login instead,
# and home/.chezmoiremove retires the boot-time default.target.wants link.
[Unit]
Requisite=graphical-session.target
PartOf=graphical-session.target
After=graphical-session.target
