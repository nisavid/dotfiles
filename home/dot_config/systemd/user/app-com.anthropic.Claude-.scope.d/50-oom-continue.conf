# PROVISIONAL (2026-09-23): keep Claude Desktop alive when the kernel OOM-kills one
# of its processes. The default (DefaultOOMPolicy=stop) made systemd tear down the
# whole app scope, and with it every Claude thread and child build, after a single
# OOM kill in the 2026-09-23 01:49-02:27 incidents.
# Also matches other app-com.anthropic.Claude-<pid>.scope units, such as leftover
# scopes that still hold processes an earlier Claude instance started.
# Revisit if a surviving Claude misbehaves after a partial kill, or once builds run
# in their own capped slice and this no longer matters.
# Revert: rm -r ~/.config/systemd/user/app-com.anthropic.Claude-.scope.d && systemctl --user daemon-reload
# Context: Claude memory "claude-scope-oompolicy-continue".
[Scope]
OOMPolicy=continue
